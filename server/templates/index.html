<html>
<head>
    <title>
        {{config_site_name}}
    </title>
    {% load static %}
    <link rel="icon" href="{% static 'Saturn_small.png' %}" type="image/x-icon">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: url("{% static 'Saturn_full.png' %}") center/cover no-repeat fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        h1 {
            color: #FFD700;
            font-size: 2.5em;
            margin-bottom: 30px;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        
        a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            padding: 12px 30px;
            border-radius: 6px;
            background-color: #f0f0f0;
            transition: all 0.3s ease;
            display: inline-block;
            margin: 10px 8px;
            border: 2px solid #667eea;
            font-size: 1em;
        }
        
        a:hover {
            background-color: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        .button-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 30px;
        }
        
        br {
            display: block;
            content: "";
            margin: 5px 0;
        }
        
        div {
            background: rgba(255, 255, 255, 0.25);
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            max-width: 600px;
            text-align: center;
        }
    </style>
</head>
<body>
<div>
    <h1>Welcome to {{config_site_name}}</h1>
    <div class="button-container">
        <a href="{{base_url}}/admin" class="btn">Admin Site</a>
        <a href="{{base_url}}/swagger" class="btn">Swagger</a>
        <a href="{{base_url}}/api" class="btn">Browsable API</a>
    </div>
</div>
</body>
</html>
